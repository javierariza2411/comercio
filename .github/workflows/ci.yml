name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, unit, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartcommerce
          POSTGRES_PASSWORD: smartcommerce
          POSTGRES_DB: smartcommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://smartcommerce:smartcommerce@localhost:5432/smartcommerce_test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0000
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace apps/api
      - run: npm run lint --workspace apps/api
      - run: npm run typecheck --workspace apps/api
      - run: npm run typecheck --workspace packages/shared
      - run: npm test --workspace apps/api
      - run: npm run db:deploy --workspace apps/api
      - run: npm run test:e2e --workspace apps/api
      - run: npm run build --workspace apps/api

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace apps/api
      - run: npm run lint --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run build --workspace apps/web
